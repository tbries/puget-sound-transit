<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puget Sound Transit Map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230098a5'/><text x='8' y='12' font-size='11' text-anchor='middle' fill='white' font-family='sans-serif'>T</text></svg>" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header id="sidebar-header">
        <h1>Puget Sound Transit</h1>
        <p id="summary">Loading data&hellip;</p>
      </header>

      <div id="controls">
        <div class="field">
          <input type="search" id="search" placeholder="Search route name or number&hellip;" autocomplete="off" />
        </div>

        <section class="filter-group" data-group="agency">
          <h2>Agency</h2>
          <div class="group-actions">
            <button type="button" data-all="agency">All</button>
            <button type="button" data-none="agency">None</button>
          </div>
          <div class="options" id="agency-options"></div>
        </section>

        <section class="filter-group" data-group="type">
          <h2>Mode</h2>
          <div class="group-actions">
            <button type="button" data-all="type">All</button>
            <button type="button" data-none="type">None</button>
          </div>
          <div class="options" id="type-options"></div>
        </section>

        <section class="filter-group" data-group="day">
          <h2>Service days</h2>
          <p class="hint">Show routes running on <em>any</em> selected day.</p>
          <div class="options" id="day-options"></div>
        </section>

        <section class="filter-group" data-group="bucket">
          <h2>Time of day</h2>
          <p class="hint">Show routes active in <em>any</em> selected window.</p>
          <div class="options" id="bucket-options"></div>
        </section>

        <section class="filter-group" data-group="route">
          <h2>Routes <span id="route-count" class="count-badge"></span></h2>
          <p class="hint">Toggle individual routes (from those matching the filters above).</p>
          <div class="group-actions">
            <button type="button" id="route-all">All</button>
            <button type="button" id="route-none">None</button>
          </div>
          <div class="options route-list" id="route-options"></div>
        </section>

        <section class="filter-group">
          <h2>Layers</h2>
          <div class="options">
            <label class="opt">
              <input type="checkbox" id="toggle-stops" />
              <span>Show stops (for visible routes)</span>
            </label>
          </div>
        </section>
      </div>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <button id="sidebar-toggle" type="button" aria-label="Toggle filters">&#9776; Filters</button>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
